name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: constitution
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: constitution

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Assert no unsafe blocks (G1 rule)
        run: |
          if grep -rn "unsafe" src/; then
            echo "::error::G1 violation: unsafe blocks are forbidden in the Constitution"
            exit 1
          fi
          echo "No unsafe blocks found — G1 clean."

  python:
    name: Python — compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pytest
          pip install "pydantic>=2.0.0" "numpy>=1.24.0" "requests>=2.31.0" \
                      "websockets>=11.0" "gitpython>=3.1.0" "cryptography>=41.0.0" \
                      "pandas>=2.0.0" "jsonschema>=4.18.0" "liboqs-python>=0.10.0" ruff hypothesis

      - name: Compile-check all modules (Done Checklist gate)
        run: python -m compileall -q cortex adapters mesh compliance simulation evolution doomsday

      - name: Ruff lint
        run: ruff check cortex adapters evolution mesh compliance simulation doomsday --ignore E501

      - name: Unit tests (all six packages)
        run: python -m pytest

  chronos-integration:
    name: Integration — Chronos × Cortex × Constitution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: constitution
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: constitution

      - name: Build constitutiond (debug)
        run: cargo build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install pytest
          pip install "pydantic>=2.0.0" "numpy>=1.24.0" "requests>=2.31.0" \
                      "websockets>=11.0" "pandas>=2.0.0" "jsonschema>=4.18.0"

      - name: Run Chronos integration harness (250 simulated years, smoke gate)
        run: |
          python simulation/tests/integration_chronos.py
        working-directory: .

      - name: Run live Cortex → Constitution pipeline
        run: |
          python run_pipeline.py
        working-directory: .

      - name: Run full-stack integration (Cortex → Constitution → Adapter → Mock)
        run: |
          python simulation/tests/integration_full_pipeline.py
        working-directory: .

      - name: Run chaos engineering scenarios
        run: |
          python simulation/tests/chaos_engine.py
        working-directory: .

  kani-verify:
    name: Kani — formal verification (advisory gate)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: constitution
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + Kani
        uses: model-checking/kani-github-action@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: constitution

      - name: Run Kani proofs
        id: kani
        run: |
          cargo kani 2>&1 | tee kani-output.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload Kani proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-proofs
          path: |
            kani-output.log
            target/kani/
          retention-days: 14

      - name: Report Kani results
        if: always()
        run: |
          echo "Kani exit code: ${{ steps.kani.outputs.exit_code }}"
          grep -E "VERIFIED|FAILED|error" kani-output.log || true

  gateway:
    name: Gateway — NestJS build + unit + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install Rust toolchain (for constitution_cli)
        uses: dtolnay/rust-toolchain@stable

      - name: Build constitution_cli (debug)
        run: cargo build
        working-directory: constitution

      - name: Install gateway dependencies
        run: npm ci
        working-directory: gateway

      - name: Build (nest build / tsc)
        run: npm run build
        working-directory: gateway

      - name: Unit tests (bridge framing, controller, CLI, cortex)
        run: npm run test:unit
        working-directory: gateway

      - name: E2E — gateway → constitution_cli → Constitution
        run: npm run test:e2e
        working-directory: gateway

  security:
    name: Security — secrets + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust dependency audit
        uses: actions-rust-lang/audit@v1

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit