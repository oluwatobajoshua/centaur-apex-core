name: Bug report
description: File a bug in Centaur-Apex Core.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Read `SECURITY.md` first — if this is a security
        vulnerability, use a Private Security Advisory, not this form.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - constitution (Rust core)
        - cortex (Python intelligence)
        - adapters (venue abstraction)
        - mesh (BFT/PQC)
        - compliance / governance
        - simulation / Chronos
        - gateway (NestJS)
        - docs / build tooling
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell me, what did you expect to happen?
      placeholder: Steps to reproduce, expected vs actual.
    validations:
      required: true
  - type: dropdown
    id: invariant
    attributes:
      label: Does this affect a 100-year invariant (I1–I8)?
      multiple: true
      options:
        - I1 drawdown
        - I2 leverage
        - I3 concentration
        - I4 numerical validity
        - I5 execution independence
        - I6 fail-safe default
        - I7 zero-human override
        - I8 autonomy
        - No
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, cargo version, release tag.
      placeholder: e.g. Windows 11, Python 3.14, cargo 1.98
    validations:
      required: false