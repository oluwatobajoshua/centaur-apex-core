version: 2
updates:
  - package-ecosystem: cargo
    directory: /constitution
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - oluwatobajoshua

  - package-ecosystem: pip
    directories:
      - /cortex
      - /adapters
      - /mesh
      - /compliance
      - /simulation
      - /evolution
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - oluwatobajoshua

  - package-ecosystem: npm
    directory: /gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - oluwatobajoshua

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly