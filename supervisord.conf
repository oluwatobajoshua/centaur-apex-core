; ==============================================================================
; Centaur-Apex Core — Production Supervisor Configuration
; Manages all long-running services with automatic restart on failure.
; This is Genesis DNA (G9: build/bootstrap tooling) — the mechanism for
; keeping Genesis components alive on a VPS. The system's self-healing
; logic (restart policy, health checks) is data-driven here, not in code.
; ==============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/centaur/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
serverurl=unix:///var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------------------------------------------------------------
; G1: Iron Constitution — the deterministic risk kernel (Rust)
; ---------------------------------------------------------------------------
[program:constitutiond]
command=/opt/centaur/constitution/target/release/constitutiond
directory=/opt/centaur/constitution
environment=CONSTITUTION_HOST="%(ENV_CONSTITUTION_HOST)s",CONSTITUTION_PORT="%(ENV_CONSTITUTION_PORT)s"
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=10
stdout_logfile=/var/log/centaur/constitutiond.log
stderr_logfile=/var/log/centaur/constitutiond.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ---------------------------------------------------------------------------
; G8: Gateway — NestJS REST API + Rust bridge
; ---------------------------------------------------------------------------
[program:gateway]
command=npm start
directory=/opt/centaur/gateway
environment=CONSTITUTION_TRANSPORT="tcp",CONSTITUTION_HOST="%(ENV_CONSTITUTION_HOST)s",CONSTITUTION_PORT="%(ENV_CONSTITUTION_PORT)s",PORT="3000"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=/var/log/centaur/gateway.log
stderr_logfile=/var/log/centaur/gateway.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ---------------------------------------------------------------------------
; G5: Continuous Cortex trading daemon — processes market ticks → proposals
;     This is the live trading loop that replaces run_pipeline.py demo
; ---------------------------------------------------------------------------
[program:cortex-trading]
command=python -m cortex.trading_daemon --asset %(ENV_TRADING_ASSET)s --equity %(ENV_TRADING_EQUITY)s --heartbeat-interval 5 --tick-interval 60
directory=/opt/centaur
environment=PYTHONPATH="/opt/centaur/cortex:/opt/centaur/adapters:/opt/centaur/evolution:/opt/centaur/mesh:/opt/centaur/compliance:/opt/centaur/simulation:/opt/centaur/doomsday:/opt/centaur",CONSTITUTION_HOST="%(ENV_CONSTITUTION_HOST)s",CONSTITUTION_PORT="%(ENV_CONSTITUTION_PORT)s"
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=10
stdout_logfile=/var/log/centaur/cortex-trading.log
stderr_logfile=/var/log/centaur/cortex-trading.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ---------------------------------------------------------------------------
; G6: Doomsday dead-man switch daemon — system watches its own liveness
;     If constitutiond + cortex heartbeat stop, escalates to liquidation
; ---------------------------------------------------------------------------
[program:doomsday]
command=python -m doomsday --run --heartbeat-interval 5
directory=/opt/centaur
environment=PYTHONPATH="/opt/centaur/cortex:/opt/centaur/adapters:/opt/centaur/evolution:/opt/centaur/mesh:/opt/centaur/compliance:/opt/centaur/simulation:/opt/centaur/doomsday:/opt/centaur"
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=10
stdout_logfile=/var/log/centaur/doomsday.log
stderr_logfile=/var/log/centaur/doomsday.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

