[package]
name = "iron_constitution"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]

[[bin]]
name = "constitutiond"
path = "src/bin/constitutiond.rs"

[[bin]]
name = "constitution_cli"
path = "src/bin/constitution_cli.rs"