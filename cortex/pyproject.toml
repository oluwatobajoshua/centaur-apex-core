[project]
name = "adaptive_cortex"
version = "0.1.0"
description = "Probabilistic AI Layer for Centaur-Apex Autonomous Trading Ecosystem"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0"
]
requires-python = ">=3.10"

[project.optional-dependencies]
testing = ["hypothesis>=6.0.0", "pytest>=7.0.0"]

[tool.hypothesis]
# Allow property-based tests to run in CI without excessive runtime
max_example = 500
